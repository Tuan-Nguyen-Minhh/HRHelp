name: AWS Deploy

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '817896957194' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'p029-ai20k-api' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'p029-ai20k-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'p029-ai20k-service' }}
  ECS_TASK_DEFINITION_TEMPLATE: .github/workflows/task_definition.json
  ECS_TASK_DEFINITION_RENDERED: /tmp/p029-task-definition.json
  CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'p029-ai20k-api' }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["main", "DeployOnAWS"]'), github.event.workflow_run.head_branch)) }}
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: meta
        run: echo "image-tag=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION"

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --pull -t "$IMAGE_URI" -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker push "$IMAGE_URI"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare task definition
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          ECS_EXECUTION_ROLE_NAME: ${{ vars.ECS_EXECUTION_ROLE_NAME || 'ecsTaskExecutionRole' }}
          ECS_LOG_GROUP: ${{ vars.ECS_LOG_GROUP || '/ecs/p029-ai20k-api' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://localhost:3000,http://127.0.0.1:3000' }}
          DB_USER_SECRET: ${{ vars.DB_USER_SECRET || 'p029/production/db_user' }}
          DB_PASSWORD_SECRET: ${{ vars.DB_PASSWORD_SECRET || 'p029/production/db_password' }}
          DB_HOST_SECRET: ${{ vars.DB_HOST_SECRET || 'p029/production/db_host' }}
          DB_NAME_SECRET: ${{ vars.DB_NAME_SECRET || 'p029/production/db_name' }}
          MISTRAL_API_KEY_SECRET: ${{ vars.MISTRAL_API_KEY_SECRET || 'p029/production/mistral_api_key' }}
          JWT_SECRET_SECRET: ${{ vars.JWT_SECRET_SECRET || 'p029/production/jwt_secret' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ["AWS_ACCOUNT_ID"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing GitHub variable(s): {', '.join(missing)}")

          template = Path(os.environ["ECS_TASK_DEFINITION_TEMPLATE"])
          rendered = Path(os.environ["ECS_TASK_DEFINITION_RENDERED"])
          replacements = {
              "AWS_ACCOUNT_ID": os.environ["AWS_ACCOUNT_ID"],
              "AWS_REGION": os.environ["AWS_REGION"],
              "ECS_EXECUTION_ROLE_NAME": os.environ["ECS_EXECUTION_ROLE_NAME"],
              "ECS_LOG_GROUP": os.environ["ECS_LOG_GROUP"],
              "CONTAINER_NAME": os.environ["CONTAINER_NAME"],
              "CORS_ORIGINS": os.environ["CORS_ORIGINS"],
              "DB_USER_SECRET": os.environ["DB_USER_SECRET"],
              "DB_PASSWORD_SECRET": os.environ["DB_PASSWORD_SECRET"],
              "DB_HOST_SECRET": os.environ["DB_HOST_SECRET"],
              "DB_NAME_SECRET": os.environ["DB_NAME_SECRET"],
              "MISTRAL_API_KEY_SECRET": os.environ["MISTRAL_API_KEY_SECRET"],
              "JWT_SECRET_SECRET": os.environ["JWT_SECRET_SECRET"],
          }

          content = template.read_text(encoding="utf-8")
          for key, value in replacements.items():
              content = content.replace("${" + key + "}", value)

          json.loads(content)
          rendered.write_text(content, encoding="utf-8")
          PY

      - name: Render image into task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_RENDERED }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Verify ECS service target
        run: |
          aws ecs describe-clusters --clusters "$ECS_CLUSTER" --region "$AWS_REGION"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION"

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
